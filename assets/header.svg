<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160">
  <defs>
    <style>@font-face{font-family:'JBM700';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}
      .n{font-family:'JBM700',ui-monospace,Menlo,monospace;font-weight:700;font-size:54px;fill:#fafaf9;letter-spacing:0.5px}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#292524" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="160" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="160" fill="url(#bg)"/>
    <rect width="1000" height="160" fill="url(#grid)" opacity="0.7"/>
    <rect width="1000" height="4" y="156" fill="#f59e0b"/>
  </g>
  <text x="500" y="96" text-anchor="middle" class="n">Shashank Chaudhary</text>
</svg>
